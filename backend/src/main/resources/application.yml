server:
  port: 8080

spring:
  servlet:
    multipart:
      # Above ProfilePhotoController's own 5MB cap, so a slightly-over-limit
      # upload gets that controller's friendly error message instead of
      # Spring rejecting it earlier with a bare 413.
      max-file-size: 8MB
      max-request-size: 8MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:masar}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:masar_user}
    password: ${DB_PASSWORD:masar_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

masar:
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-to-a-long-random-string}
    expiration-ms: 900000        # 15 minutes - short-lived access token
  refresh:
    expiration-ms: 2592000000    # 30 days - refresh token
  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  login:
    max-attempts: 5
    lockout-minutes: 15
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,capacitor://localhost,http://localhost}
